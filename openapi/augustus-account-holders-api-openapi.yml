    V1BusinessBeneficiaryDataResponse:
      type: object
      properties:
        legal_business_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Full legal name of the business.
          example: Acme Sandbox Ltd.
        doing_business_as:
          type: string
          maxLength: 255
          description: Trade name the business operates under, if different from the legal name.
          example: Acme Payments
          nullable: true
        registered_address:
          anyOf:
          - $ref: '#/components/schemas/V1UsResidentialAddress'
          - $ref: '#/components/schemas/V1NonUsResidentialAddress'
          description: 'Registered legal address of the business. **US address** requires `country_code: US` and a two-letter `state`. **Non-US address** accepts any other country and allows `state` to be null.'
        physical_address:
          anyOf:
          - $ref: '#/components/schemas/V1UsResidentialAddress'
          - $ref: '#/components/schemas/V1NonUsResidentialAddress'
          description: 'Physical operating address of the business. **US address** requires `country_code: US` and a two-letter `state`. **Non-US address** accepts any other country and allows `state` to be null.'
        registration_number:
          oneOf:
          - $ref: '#/components/schemas/V1EinIdentification'
          - $ref: '#/components/schemas/V1SsnIdentification'
          description: 'Business registration number: type "ein" (Employer Identification Number, format ##-#######) or "ssn" (Social Security Number, format ###-##-####).'
        year_of_incorporation:
          type: integer
          minimum: 1800
          maximum: 3000
          description: Four-digit year the business was incorporated.
        state_of_incorporation:
          type: string
          minLength: 1
          description: State or subdivision where the business is incorporated.
          example: Delaware
        country_of_incorporation:
          description: ISO 3166-1 alpha-2 country code where the business is incorporated.
          $ref: '#/components/schemas/Alpha2Code'
        beneficial_owners:
          minItems: 1
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/V1UsBeneficiaryDataResponse'
            - $ref: '#/components/schemas/V1NonUsBeneficiaryDataResponse'
          description: Beneficial owners of the business. At least one required.
        control_person:
          anyOf:
          - type: object
            properties:
              legal_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Full legal name of the account holder.
                example: Jordan Rivera
              residential_address:
                anyOf:
                - $ref: '#/components/schemas/V1UsResidentialAddress'
                - $ref: '#/components/schemas/V1NonUsResidentialAddress'
                description: 'Residential address of the account holder. **US address** requires `country_code: US` and a two-letter `state`. **Non-US address** accepts any other country and allows `state` to be null.'
              date_of_birth:
                type: string
                format: date
                description: Date of birth as an ISO 8601 calendar date (YYYY-MM-DD).
                example: '1990-01-15'
              identification:
                oneOf:
                - $ref: '#/components/schemas/V1SsnIdentification'
                - $ref: '#/components/schemas/V1ItinIdentification'
                description: 'Government-issued identification with type: "ssn" (Social Security Number, format ###-##-####) or "itin" (Individual Taxpayer ID, format 9##-##-####).'
              country_of_citizenship:
                type: string
                description: ISO 3166-1 alpha-2 country code of citizenship.
                enum:
                - US
              title:
                type: string
                minLength: 1
                maxLength: 255
                description: Role of the control person at the business (e.g., "CEO", "President", "Managing Director").
                example: CEO
            required:
            - legal_name
            - residential_address
            - date_of_birth
            - identification
            - country_of_citizenship
            - title
            additionalProperties: false
