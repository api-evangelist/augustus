    ListAccountHoldersResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[0-9a-fA-F]{24}$
                description: Unique identifier of the account holder.
                example: 68e0a1b2c3d4e5f60718293a
              type:
                type: string
                description: Resource type discriminator.
                enum:
                - account_holder
              holder_type:
                type: string
                enum:
                - natural_person
                - business
                description: Type of the account holder.
              status:
                type: string
                enum:
                - pending
                - active
                - closed
                description: Current account holder status.
              beneficiary_data:
                anyOf:
                - $ref: '#/components/schemas/V1UsBeneficiaryDataResponse'
                - $ref: '#/components/schemas/V1NonUsBeneficiaryDataResponse'
                - $ref: '#/components/schemas/V1BusinessBeneficiaryDataResponse'
                description: 'Beneficiary details used to create this account holder. Which shape is returned follows `country_of_citizenship`: **US individual** when it is `US`, **Non-US individual** for any other country, **Business** when `holder_type` is `business`.'
              metadata:
                type: object
                additionalProperties:
                  type: string
                  maxLength: 500
                description: Set of up to 50 key-value string pairs you can attach to store structured information, such as correlating this resource with an object in your own system. Keys may be up to 40 characters and values up to 500 characters.
                example:
                  invoice_id: INV-2026-0042
              created_at:
                type: string
                format: date-time
                description: ISO 8601 UTC timestamp when the account holder was created.
                example: '2026-01-15T10:30:00Z'
            required:
            - id
            - type
            - holder_type
            - status
            - beneficiary_data
            - metadata
            - created_at
            additionalProperties: false
        has_more:
          type: boolean
        next_cursor:
          type: string
          example: eyJsYXN0X2lkIjoiNTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDA2In0
          nullable: true
        has_previous:
          type: boolean
        previous_cursor:
