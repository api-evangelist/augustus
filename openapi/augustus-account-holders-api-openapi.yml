openapi: 3.2.0
info:
  title: Augustus Banking Account Holders API
  description: Augustus Banking API
  version: 0.1.0
  contact:
    name: Augustus
    url: https://docs.augustus.com
    email: developer@augustus.com
servers:
- url: https://api.augustus.com
  description: Production
- url: https://api.sandbox.augustus.com
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Account Holders
paths:
  /v1/account_holders:
    get:
      description: Lists account holders for the merchant with cursor-based pagination.
      operationId: AccountHoldersController_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results per page (1-100). Defaults to 10.
        schema:
          minimum: 1
          maximum: 100
          default: 10
          type: integer
      - name: cursor
        required: false
        in: query
        description: Opaque cursor from a previous next_cursor.
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of account holders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountHoldersResponseDto'
      summary: List account holders
      tags:
      - Account Holders
    post:
      description: Creates a new account holder and starts asynchronous processing.
      operationId: AccountHoldersController_create
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key for safe retries. Reusing a key with an identical request body returns the cached response. Reusing a key with a different body returns 409.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Account holder parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountHolderBodyDto'
      responses:
        '200':
          description: Account holder created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHolderResourceDto'
      summary: Create account holder
      tags:
      - Account Holders
  /v1/account_holders/{id}:
    get:
      description: Retrieves an account holder by ID.
      operationId: AccountHoldersController_retrieve
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the account holder.
        schema:
          pattern: ^[0-9a-fA-F]{24}$
          example: 68e0a1b2c3d4e5f60718293a
          type: string
      responses:
        '200':
          description: The account holder resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHolderResourceDto'
      summary: Retrieve account holder
      tags:
      - Account Holders
    post:
      description: Replaces the beneficiary details of an existing account holder.
      operationId: AccountHoldersController_update
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the account holder.
        schema:
          pattern: ^[0-9a-fA-F]{24}$
          example: 68e0a1b2c3d4e5f60718293a
          type: string
      - name: Idempotency-Key
        in: header
        description: Idempotency key for safe retries. Reusing a key with an identical request body returns the cached response. Reusing a key with a different body returns 409.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: New beneficiary details for the account holder
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountHolderBodyDto'
      responses:
        '200':
          description: The updated account holder resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHolderResourceDto'
      summary: Update account holder
      tags:
      - Account Holders
components:
  schemas:
    AccountHolderResourceDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Unique identifier of the account holder.
          example: 68e0a1b2c3d4e5f60718293a
        type:
          type: string
          description: Resource type discriminator.
          enum:
          - account_holder
        holder_type:
          type: string
          enum:
          - natural_person
          - business
          description: Type of the account holder.
        status:
          type: string
          enum:
          - pending
          - active
          - closed
          description: Current account holder status.
        beneficiary_data:
          anyOf:
          - $ref: '#/components/schemas/V1UsBeneficiaryDataResponse'
          - $ref: '#/components/schemas/V1NonUsBeneficiaryDataResponse'
          - $ref: '#/components/schemas/V1BusinessBeneficiaryDataResponse'
          description: 'Beneficiary details used to create this account holder. Which shape is returned follows `country_of_citizenship`: **US individual** when it is `US`, **Non-US individual** for any other country, **Business** when `holder_type` is `business`.'
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
          description: Set of up to 50 key-value string pairs you can attach to store structured information, such as correlating this resource with an object in your own system. Keys may be up to 40 characters and values up to 500 characters.
          example:
            invoice_id: INV-2026-0042
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the account holder was created.
          example: '2026-01-15T10:30:00Z'
      required:
      - id
      - type
      - holder_type
      - status
      - beneficiary_data
      - metadata
      - created_at
      additionalProperties: false
