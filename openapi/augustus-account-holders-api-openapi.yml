    V1SsnIdentification:
      type: object
      properties:
        type:
          type: string
          enum:
          - ssn
        value:
          type: string
          pattern: ^\d{3}-\d{2}-\d{4}$
          example: 123-45-6789
      required:
      - type
      - value
      additionalProperties: false
      title: SSN
    V1ItinIdentification:
      type: object
      properties:
        type:
          type: string
          enum:
          - itin
        value:
          type: string
          pattern: ^9\d{2}-\d{2}-\d{4}$
          example: 912-34-5678
      required:
      - type
      - value
      additionalProperties: false
      title: ITIN
    V1NonUsResidentialAddress:
      type: object
      properties:
        line_1:
          type: string
          minLength: 1
          maxLength: 255
          description: Primary street address.
          example: Unter den Linden 77
        line_2:
          type: string
          maxLength: 255
          description: Secondary street address, or null if not recorded.
          example: Apartment 4B
          nullable: true
        city:
          type: string
          minLength: 1
          maxLength: 255
          description: City or locality.
          example: Berlin
        state:
          type: string
          description: State, province, or region, or null if not recorded.
          example: Berlin
          nullable: true
        postal_code:
          type: string
          minLength: 1
          maxLength: 30
          description: Postal or ZIP code.
          example: '10115'
        country_code:
          description: ISO 3166-1 alpha-2 country code.
          $ref: '#/components/schemas/Alpha2CodeWithoutUs'
      required:
      - line_1
      - line_2
      - city
      - state
      - postal_code
      - country_code
      additionalProperties: false
      title: Non-US address
