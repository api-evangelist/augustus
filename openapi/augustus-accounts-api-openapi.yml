    ItinIdentification:
      type: object
      properties:
        type:
          type: string
          enum:
          - itin
        value:
          type: string
          pattern: ^9\d{2}-\d{2}-\d{4}$
      required:
      - type
      - value
      additionalProperties: false
    SortCodeFinancialAddress:
      type: object
      properties:
        type:
          description: Discriminator for UK sort code financial address.
          type: string
          enum:
          - sort_code
        sort_code:
          description: UK sort code (6 digits).
          type: string
        account_number:
          description: UK account number (8 digits).
          type: string
        account_holder_name:
          description: Name of the account holder.
          type: string
      required:
