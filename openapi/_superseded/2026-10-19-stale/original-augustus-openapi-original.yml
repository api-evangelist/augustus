                description: ISO 8601 UTC timestamp when the payout was created.
                type: string
                format: date-time
              updated_at:
                description: ISO 8601 UTC timestamp when the payout was last updated.
                type: string
                format: date-time
            required:
              - id
              - type
              - status
              - source_account_id
              - amount
              - currency
              - destination
              - reference
              - failure
              - metadata
              - created_at
              - updated_at
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
      required:
        - data
        - has_more
        - next_cursor
