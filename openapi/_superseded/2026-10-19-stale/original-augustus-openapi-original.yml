        data:
          type: array
          items:
            type: object
            properties:
              id:
                description: Unique identifier of the return.
                type: string
                format: uuid
              type:
                description: Type of the resource.
                type: string
                enum:
                  - return
              status:
                description: Current status of the return.
                type: string
                enum:
                  - pending
                  - paid
                  - failed
                  - returned
              deposit_id:
                description: ID of the parent deposit.
                type: string
                format: uuid
              amount:
                description: Amount as a string decimal (e.g. "100.50").
                type: string
              currency:
                description: >-
                  Currency code (ISO 4217 currency code or crypto currency
                  code).
                type: string
                enum:
                  - EUR
                  - GBP
                  - USD
                  - USDC
                  - BTC
                  - ETH
                  - SOL
                  - POL
              failure:
                description: Failure details when status is failed, otherwise null.
                type: object
                properties:
                  code:
                    description: Failure code.
                    type: string
                    enum:
                      - account_closed
                      - account_blocked
                      - insufficient_funds
                      - invalid_account_format
                      - invalid_instruction
                      - invalid_amount
                      - invalid_time
                      - duplicate_transaction
                      - payee_verification_failed
                      - system_error
                      - provider_system_error
                      - rejected_by_correspondent_bank
                      - blocked_by_review
                      - unknown
                    x-enumNames:
                      - ACCOUNT_CLOSED
                      - ACCOUNT_BLOCKED
                      - INSUFFICIENT_FUNDS
                      - INVALID_ACCOUNT_FORMAT
                      - INVALID_INSTRUCTION
                      - INVALID_AMOUNT
                      - INVALID_TIME
                      - DUPLICATE_TRANSACTION
                      - PAYEE_VERIFICATION_FAILED
                      - SYSTEM_ERROR
                      - PROVIDER_SYSTEM_ERROR
                      - REJECTED_BY_CORRESPONDENT_BANK
                      - BLOCKED_BY_REVIEW
                      - UNKNOWN
                  message:
                    description: Human-readable description of the failure.
                    type: string
                  retry:
                    description: Whether the return can be retried.
                    type: boolean
                required:
                  - code
                  - message
                  - retry
                nullable: true
              created_at:
                description: ISO 8601 UTC timestamp when the return was created.
                type: string
                format: date-time
              updated_at:
                description: ISO 8601 UTC timestamp when the return was last updated.
                type: string
                format: date-time
            required:
              - id
              - type
              - status
              - deposit_id
              - amount
              - currency
              - failure
              - created_at
              - updated_at
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
      required:
        - data
        - has_more
        - next_cursor
