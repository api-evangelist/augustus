openapi: 3.1.0
paths:
  /v1/account_programs:
    get:
      description: Lists account programs for the merchant with cursor-based pagination.
      operationId: AccountProgramsController_list
      parameters:
        - name: limit
          required: false
          in: query
          description: Number of results per page (1-100). Defaults to 10.
          schema:
            minimum: 1
            maximum: 100
            exclusiveMaximum: false
            exclusiveMinimum: false
            default: 10
            type: integer
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from a previous next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of account programs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountProgramsResponseDto'
      summary: List account programs
      tags:
        - Account Programs
      x-codeSamples:
        - lang: JavaScript
          source: >-
            import Augustus from '@augustusbank/typescript-sdk';


            const client = new Augustus({
              apiKey: process.env['AUGUSTUS_API_KEY'], // This is the default and can be omitted
            });


            // Automatically fetches more pages as needed.

            for await (const accountProgramListResponse of
            client.accountPrograms.list()) {
              console.log(accountProgramListResponse.id);
            }
  /v1/account_programs/{id}/balance:
    get:
      description: >-
        Returns the aggregated available balance for all virtual accounts under
        the account program.
      operationId: AccountProgramsController_retrieveBalance
      parameters:
        - name: id
          required: true
          in: path
          description: Unique identifier of the account program.
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: Account program balance snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProgramBalanceResourceDto'
      summary: Retrieve account program balance
      tags:
        - Account Programs
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Augustus from '@augustusbank/typescript-sdk';

            const client = new Augustus({
              apiKey: process.env['AUGUSTUS_API_KEY'], // This is the default and can be omitted
            });

            const response = await client.accountPrograms.retrieveBalance(
              '182bd5e5-6e1a-4fe4-a799-aa6d9a6ab26e',
            );

            console.log(response.id);
  /v1/account_programs/{id}:
    get:
      description: Retrieves an account program by ID.
      operationId: AccountProgramsController_retrieve
      parameters:
        - name: id
          required: true
          in: path
          description: Unique identifier of the account program.
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: The account program resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProgramResourceDto'
      summary: Retrieve account program
      tags:
        - Account Programs
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Augustus from '@augustusbank/typescript-sdk';

            const client = new Augustus({
              apiKey: process.env['AUGUSTUS_API_KEY'], // This is the default and can be omitted
            });

            const accountProgram = await client.accountPrograms.retrieve(
              '182bd5e5-6e1a-4fe4-a799-aa6d9a6ab26e',
            );

            console.log(accountProgram.id);
  /v1/accounts:
    get:
      description: Returns a paginated list of accounts.
      operationId: AccountsController_list
      parameters:
        - name: limit
          required: false
          in: query
          description: Number of results per page (1-100). Defaults to 10.
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: integer
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from a previous next_cursor.
          schema:
            type: string
        - name: account_number
          required: false
          in: query
          description: >-
            Filter by exact fiat account number. Crypto wallets are excluded
            when set.
          schema:
            minLength: 1
            type: string
        - name: account_holder_name
          required: false
          in: query
          description: >-
            Filter by account holder name (case-insensitive phrase match).
            Crypto wallets are excluded when set.
          schema:
            minLength: 1
            type: string
        - name: status
          required: false
          in: query
          description: Filter by account status.
          schema:
            type: string
            enum:
              - pending
              - active
              - frozen
        - name: parent_id
          required: false
          in: query
          description: ID of the account program to list virtual accounts for.
          schema:
            format: uuid
            pattern: >-
              ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
            type: string
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponseDto'
      summary: List accounts
      tags:
        - Accounts
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Augustus from '@augustusbank/typescript-sdk';

            const client = new Augustus({
              apiKey: process.env['AUGUSTUS_API_KEY'], // This is the default and can be omitted
            });

            // Automatically fetches more pages as needed.
            for await (const accountListResponse of client.accounts.list()) {
              console.log(accountListResponse.id);
            }
    post:
      description: Creates a new account.
      operationId: AccountsController_create
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            Idempotency key for safe retries. Reusing a key with an identical
            request body returns the cached response. Reusing a key with a
            different body returns 409.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        description: Account parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountBodyDto'
      responses:
        '200':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResourceDto'
      summary: Create account
      tags:
        - Accounts
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Augustus from '@augustusbank/typescript-sdk';

            const client = new Augustus({
              apiKey: process.env['AUGUSTUS_API_KEY'], // This is the default and can be omitted
            });

            const account = await client.accounts.create({
              account_program_id: '182bd5e5-6e1a-4fe4-a799-aa6d9a6ab26e',
              account_type: 'virtual_account',
              beneficiary_data: {
                country_of_citizenship: 'US',
                date_of_birth: '2019-12-27',
                identification: { type: 'ssn', value: '732-66-9102' },
                legal_name: 'x',
                residential_address: {
                  city: 'x',
                  country: 'US',
                  postal_code: 'x',
                  state: 'xx',
                  street_line_1: 'x',
                },
              },
            });

            console.log(account.id);
