                        description: UK sort code (6 digits).
                        type: string
                      account_number:
                        description: UK account number (8 digits).
                        type: string
                      account_holder_name:
                        description: Name of the account holder.
                        type: string
                    required:
                      - type
                      - sort_code
                      - account_number
                      - account_holder_name
                  - type: object
                    properties:
                      type:
                        description: Discriminator for ABA wire financial address.
                        type: string
                        enum:
                          - aba
                      routing_number:
                        description: ABA routing number (9 digits).
                        type: string
                      account_number:
                        description: Bank account number.
                        type: string
                      account_holder_name:
                        description: Name of the account holder.
                        type: string
                    required:
                      - type
                      - routing_number
                      - account_number
                      - account_holder_name
                  - type: object
                    properties:
                      type:
                        description: Discriminator for crypto wallet financial address.
                        type: string
                        enum:
                          - crypto_wallet
                      address:
                        description: Wallet address on the specified blockchain.
                        type: string
                      blockchain:
                        description: Blockchain network for the crypto wallet.
                        type: string
                        enum:
                          - bitcoin
                          - ethereum
                          - solana
                          - polygon
                          - bitcoin_testnet4
                          - ethereum_sepolia
                          - solana_devnet
                          - polygon_amoy
                    required:
                      - type
                      - address
                      - blockchain
              reference:
                description: Payment reference.
                type: string
              failure:
                description: Failure details when status is failed, otherwise null.
                type: object
                properties:
                  code:
                    description: Failure code.
                    type: string
                    enum:
                      - account_closed
                      - account_blocked
                      - insufficient_funds
                      - invalid_account_format
                      - invalid_instruction
                      - invalid_amount
                      - invalid_time
                      - duplicate_transaction
                      - payee_verification_failed
                      - system_error
                      - provider_system_error
                      - rejected_by_correspondent_bank
                      - blocked_by_review
