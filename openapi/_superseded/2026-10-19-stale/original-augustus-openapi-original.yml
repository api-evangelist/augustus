  /v1/events:
    get:
      description: >-
        Lists webhook events for the merchant with cursor-based pagination.
        Events are retained for 30 days.
      operationId: EventsController_list
      parameters:
        - name: limit
          required: false
          in: query
          description: Number of results per page (1-100). Defaults to 10.
          schema:
            minimum: 1
            maximum: 100
            exclusiveMaximum: false
            exclusiveMinimum: false
            default: 10
            type: integer
        - name: cursor
          required: false
          in: query
          description: Opaque cursor from a previous next_cursor.
          schema:
            type: string
        - name: event_type
          required: false
          in: query
          description: Filter by event type.
          schema:
            type: string
            enum:
              - payout.created
              - payout.initiated
              - payout.paid
              - payout.failed
              - return.initiated
              - return.paid
              - return.failed
              - return.returned
              - deposit.received
              - conversion.created
              - conversion.completed
              - conversion.failed
