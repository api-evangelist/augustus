        expires_at:
          description: >-
            ISO 8601 UTC timestamp at which this key expires. `null` if the key
            has no expiry.
          type: string
          format: date-time
          nullable: true
        created_at:
          description: ISO 8601 UTC timestamp at which this key was created.
          type: string
          format: date-time
        updated_at:
          description: >-
            ISO 8601 UTC timestamp of the last update to this key (e.g. roll, IP
            allowlist change, revoke). `null` if the key has not been updated
            since creation.
          type: string
          format: date-time
          nullable: true
        api_version:
          description: >-
            Effective API version for the request (header value or merchant
            pin).
          type: string
      required:
        - type
        - id
        - merchant_id
        - scopes
        - ip_allow_list
        - expires_at
        - created_at
        - updated_at
        - api_version
    ListApiVersionsResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - api_version
              name:
                description: >-
                  Version identifier as sent in the `api-version` request
                  header.
                type: string
              released_at:
                description: When this version became publicly available, ISO 8601 UTC.
                type: string
                format: date-time
              is_latest:
                description: >-
                  True for the most recently published version. New accounts and
                  unpinned merchants resolve to this version.
                type: boolean
              deprecated_at:
                description: >-
                  When this version was marked deprecated, ISO 8601 UTC. Null if
                  not deprecated.
                type: string
                format: date-time
                nullable: true
              sunset_at:
                description: >-
                  When this version will stop being served, ISO 8601 UTC. Null
                  if no sunset is scheduled.
                type: string
                format: date-time
                nullable: true
            required:
              - type
              - name
              - released_at
              - is_latest
              - deprecated_at
              - sunset_at
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
      required:
        - data
        - has_more
        - next_cursor
