openapi: 3.2.0
info:
  title: Augustus Banking API Versions API
  description: Augustus Banking API
  version: 0.1.0
  contact:
    name: Augustus
    url: https://docs.augustus.com
    email: developer@augustus.com
servers:
- url: https://api.augustus.com
  description: Production
- url: https://api.sandbox.augustus.com
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: API Versions
paths:
  /v1/api_versions:
    get:
      description: 'Returns the catalogue of publicly available Augustus Banking API versions, ordered oldest to newest. New accounts and unpinned merchants resolve to the entry with `is_latest: true`. Public: no authentication required.'
      operationId: ApiVersionsController_list
      parameters: []
      responses:
        '200':
          description: API version catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiVersionsResponseDto'
      summary: List API versions
      tags:
      - API Versions
components:
  schemas:
    ListApiVersionsResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: Resource type discriminator.
                enum:
                - api_version
              name:
                type: string
                description: Version identifier as sent in the `api-version` request header.
                example: '2026-05-01'
              released_at:
                type: string
                format: date-time
                description: When this version became publicly available, ISO 8601 UTC.
                example: '2026-01-15T10:30:00Z'
              is_latest:
                type: boolean
                description: True for the most recently published version. New accounts and unpinned merchants resolve to this version.
              deprecated_at:
                type: string
                format: date-time
                description: When this version was marked deprecated, ISO 8601 UTC. Null if not deprecated.
                nullable: true
              sunset_at:
                type: string
                format: date-time
                description: When this version will stop being served, ISO 8601 UTC. Null if no sunset is scheduled.
                nullable: true
            required:
            - type
            - name
            - released_at
            - is_latest
            - deprecated_at
            - sunset_at
            additionalProperties: false
        has_more:
          type: boolean
        next_cursor:
          type: string
          example: eyJsYXN0X2lkIjoiNTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDA2In0
          nullable: true
        has_previous:
          type: boolean
        previous_cursor:
          type: string
          example: eyJsYXN0X2lkIjoiNTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDA2In0
          nullable: true
      required:
      - data
      - has_more
      - next_cursor
      - has_previous
      - previous_cursor
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Bearer token for authentication with Augustus Banking API
x-provenance:
  method: harvested
  publisher: Augustus
  source: https://api.augustus.com/openapi/2026-05-01.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
