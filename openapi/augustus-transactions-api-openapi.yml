        bic: ANZBAU3MXXX
        account_number: '123456789'
        account_holder_name: Acme Sandbox Pty Ltd.
        local_bank_code: '012003'
        account_type: checking
    TransactionResourceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the transaction.
          example: 550e8400-e29b-41d4-a716-44665544000d
        type:
          type: string
