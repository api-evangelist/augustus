    CreateAccountProgramSimulationBodyDto:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          description: Human-readable label for the account program.
          example: Primary FBO program
        type:
          type: string
          enum:
          - fbo_program
          - fbo_sponsored
          description: Account program type. Simulation supports FBO programs only.
      required:
      - label
      - type
      additionalProperties: false
    CreateAccountSimulationBodyDto:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          description: Human-readable label for the operating account.
          example: Operating USD account
        type:
          type: string
          enum:
          - operating
          description: Account type.
      required:
      - label
      - type
      additionalProperties: false
    DepositSimulationResourceDto:
      type: object
      properties:
        type:
          type: string
          description: Resource type discriminator.
          enum:
          - deposit_simulation
        account_id:
          type: string
          format: uuid
          description: Account receiving the simulated deposit.
      required:
      - type
      - account_id
      additionalProperties: false
    ReturnSimulationResourceDto:
      type: object
      properties:
        type:
          type: string
          description: Resource type discriminator.
          enum:
          - return_simulation
        return_id:
          type: string
          format: uuid
          description: Return whose lifecycle is being simulated.
      required:
      - type
      - return_id
      additionalProperties: false
    AccountSimulationResourceDto:
      type: object
      properties:
        type:
          type: string
          description: Resource type discriminator.
          enum:
          - account_simulation
        account_id:
          type: string
          format: uuid
          description: Account whose lifecycle is being simulated.
      required:
      - type
      - account_id
      additionalProperties: false
    BicFinancialAddressRequest:
      type: object
      properties:
        type:
          type: string
          description: Discriminator for BIC + local account financial address.
          enum:
          - bic
        bic:
          type: string
          description: ISO 9362 Bank Identifier Code (8 or 11 characters).
        account_number:
          type: string
          minLength: 1
          maxLength: 34
          pattern: ^[A-Za-z0-9]+$
          description: Local-format bank account number (1-34 alphanumeric characters).
        account_holder_name:
          type: string
          minLength: 1
          description: Name of the account holder.
        local_bank_code:
          type: string
          description: Domestic bank or branch code where the destination country uses one (for example the BSB in Australia). Optional; omit or send null where the country has none.
          nullable: true
        account_type:
          type: string
          enum:
          - checking
          - savings
          - null
          description: Whether the account is a checking or a savings account. Optional; omit or send null if not provided. Some destination countries require it (for example the Dominican Republic, Honduras and Jamaica) and ACH uses it for the transaction code. A payment to an account without one is sent as checking.
          nullable: true
      required:
      - type
      - bic
      - account_number
      - account_holder_name
      additionalProperties: false
      title: BIC
      example:
        type: bic
        bic: ANZBAU3MXXX
        account_number: '123456789'
        account_holder_name: Acme Sandbox Pty Ltd.
        local_bank_code: '012003'
        account_type: checking
    AccountProgramSimulationResourceDto:
      type: object
      properties:
        type:
          type: string
          description: Resource type discriminator.
          enum:
          - account_program_simulation
        account_program_id:
          type: string
          format: uuid
          description: Account program whose lifecycle is being simulated.
      required:
      - type
      - account_program_id
      additionalProperties: false
    ReturnPayoutSimulationBodyDto:
      type: object
      properties:
        reason:
          type: string
          enum:
          - account_closed
          - invalid_account_format
          - invalid_routing_number
          - account_blocked
          - unknown
          description: Reason the receiving bank returns the settled payout.
      required:
      - reason
      additionalProperties: false
    AbaFinancialAddressRequest:
      type: object
      properties:
        type:
          type: string
          description: Discriminator for ABA wire financial address.
          enum:
          - aba
        routing_number:
          type: string
          description: ABA routing number (9 digits).
        account_number:
          type: string
          pattern: ^\d+$
          description: Bank account number.
        account_holder_name:
          type: string
          minLength: 1
          description: Name of the account holder.
        account_type:
          type: string
          enum:
          - checking
          - savings
          - null
          description: Whether the account is a checking or a savings account. Optional; omit or send null if not provided. Some destination countries require it (for example the Dominican Republic, Honduras and Jamaica) and ACH uses it for the transaction code. A payment to an account without one is sent as checking.
          nullable: true
      required:
      - type
      - routing_number
      - account_number
      - account_holder_name
      additionalProperties: false
      title: ABA
      example:
        type: aba
        routing_number: '110000000'
        account_number: 000123456789
        account_holder_name: Acme Sandbox Ltd.
        account_type: checking
    DrainAccountProgramSimulationBodyDto:
      type: object
      properties:
        destination:
          oneOf:
          - $ref: '#/components/schemas/AbaFinancialAddressRequest'
          - $ref: '#/components/schemas/IbanFinancialAddressRequest'
          - $ref: '#/components/schemas/SortCodeFinancialAddressRequest'
          description: Fiat financial address to which the residual balance of every frozen account under the program is drained.
      required:
      - destination
      additionalProperties: false
    ReturnOfReturnSimulationBodyDto:
      type: object
      properties:
        reason:
          type: string
          enum:
          - account_closed
          - invalid_account_format
          - invalid_routing_number
          - account_blocked
          - unknown
          description: Reason the receiving bank returns the sent return.
      required:
      - reason
      additionalProperties: false
    DrainAccountSimulationBodyDto:
      type: object
      properties:
        destination:
          oneOf:
          - $ref: '#/components/schemas/AbaFinancialAddressRequest'
          - $ref: '#/components/schemas/IbanFinancialAddressRequest'
          - $ref: '#/components/schemas/SortCodeFinancialAddressRequest'
          description: Fiat financial address to which the residual balance of the frozen account is drained.
      required:
      - destination
      additionalProperties: false
    CreateDepositSimulationBodyDto:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
          description: ID of the account to credit with the simulated deposit.
        amount:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d+)?$
          description: Amount as a decimal string in the account currency (e.g. "100.50").
          example: '100.50'
        currency:
          type: string
          enum:
          - EUR
          - GBP
          - USD
          - USDC
          description: Currency of the simulated deposit.
          example: USD
        unstructured_remittance_information:
          description: Unstructured remittance information attached to the transfer. Not all rails support this field.
          example: Invoice INV-2026-0042
          type: string
          minLength: 1
        counterparty:
          description: Sender of the simulated deposit. Mutually exclusive with `counterparty_id`.
          type: object
          properties:
            financial_address:
              oneOf:
              - $ref: '#/components/schemas/AbaFinancialAddressRequest'
              - $ref: '#/components/schemas/IbanFinancialAddressRequest'
              - $ref: '#/components/schemas/SortCodeFinancialAddressRequest'
              - $ref: '#/components/schemas/BicFinancialAddressRequest'
              - $ref: '#/components/schemas/CryptoWalletFinancialAddress'
              description: Financial address of the counterparty.
            physical_address:
              type: object
              properties:
                line_1:
                  type: string
                  description: Primary street address.
                  example: 548 Market St
                line_2:
                  type: string
                  description: Secondary street address. Optional; omit or send null if not recorded.
                  example: Apartment 4B
                  nullable: true
                city:
                  type: string
                  description: City or locality.
                  example: San Francisco
                postal_code:
                  type: string
                  description: Postal or ZIP code.
                  example: '94103'
                state:
                  type: string
                  description: State, province, or region. Optional; omit or send null if not recorded.
                  example: CA
                  nullable: true
                country_code:
                  example: US
                  description: ISO 3166-1 alpha-2 country code.
                  $ref: '#/components/schemas/Alpha2Code'
              required:
              - line_1
              - city
              - postal_code
              - country_code
              additionalProperties: false
              description: Physical address of the counterparty.
              nullable: true
          required:
          - financial_address
          additionalProperties: false
        counterparty_id:
          description: ID of an existing counterparty to use as the sender of the simulated deposit. Mutually exclusive with `counterparty`.
          type: string
          format: uuid
        rail:
          description: Payment rail the simulated deposit arrives on.
          type: string
          enum:
          - sepa
          - sepa_instant
          - faster_payments
          - swift
          - ach
          - fedwire
          - ethereum
          - ethereum_sepolia
          - solana
          - solana_devnet
          - polygon
          - polygon_amoy
      required:
      - account_id
      - amount
      - currency
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Bearer token for authentication with Augustus Banking API
