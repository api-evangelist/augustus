openapi: 3.2.0
info:
  title: Augustus Banking Counterparties API
  description: Augustus Banking API
  version: 0.1.0
  contact:
    name: Augustus
    url: https://docs.augustus.com
    email: developer@augustus.com
servers:
- url: https://api.augustus.com
  description: Production
- url: https://api.sandbox.augustus.com
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Counterparties
paths:
  /v1/counterparties:
    post:
      description: Creates a counterparty owned by the merchant.
      operationId: CounterpartiesController_create
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key for safe retries. Reusing a key with an identical request body returns the cached response. Reusing a key with a different body returns 409.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Counterparty parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCounterpartyBodyDto'
      responses:
        '200':
          description: The created counterparty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyResourceDto'
      summary: Create counterparty
      tags:
      - Counterparties
    get:
      description: Lists counterparties owned by the merchant with cursor-based pagination.
      operationId: CounterpartiesController_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results per page (1-100). Defaults to 10.
        schema:
          minimum: 1
          maximum: 100
          default: 10
          type: integer
      - name: cursor
        required: false
        in: query
        description: Opaque cursor from a previous next_cursor.
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of counterparties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCounterpartiesResponseDto'
      summary: List counterparties
      tags:
      - Counterparties
  /v1/counterparties/{id}:
    post:
      description: Updates the mutable details of a counterparty owned by the merchant.
      operationId: CounterpartiesController_update
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the counterparty.
        schema:
          format: uuid
          type: string
      - name: Idempotency-Key
        in: header
        description: Idempotency key for safe retries. Reusing a key with an identical request body returns the cached response. Reusing a key with a different body returns 409.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Counterparty fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCounterpartyBodyDto'
      responses:
        '200':
          description: The updated counterparty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyResourceDto'
      summary: Update counterparty
      tags:
      - Counterparties
    get:
      description: Retrieves a counterparty owned by the merchant.
      operationId: CounterpartiesController_retrieve
      parameters:
      - name: id
        required: true
        in: path
        description: Unique identifier of the counterparty.
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: The counterparty resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyResourceDto'
      summary: Retrieve counterparty
      tags:
      - Counterparties
components:
  schemas:
    SortCodeFinancialAddress:
      type: object
      properties:
        type:
          type: string
          description: Discriminator for UK sort code financial address.
          enum:
          - sort_code
        sort_code:
          type: string
          description: UK sort code (6 digits).
        account_number:
          type: string
          description: UK account number (8 digits).
        account_holder_name:
          type: string
          description: Name of the account holder.
      required:
      - type
      - sort_code
      - account_number
      - account_holder_name
      additionalProperties: false
      title: UK Sort Code
      example:
        type: sort_code
        sort_code: '040075'
        account_number: '37778842'
        account_holder_name: Acme Sandbox Ltd.
    CryptoWalletFinancialAddress:
      type: object
      properties:
        type:
          type: string
          description: Discriminator for crypto wallet financial address.
          enum:
          - crypto_wallet
        address:
          type: string
          description: Wallet address on the specified blockchain.
        blockchain:
          type: string
          enum:
          - bitcoin
          - ethereum
          - solana
          - polygon
          - bitcoin_testnet4
          - ethereum_sepolia
          - solana_devnet
          - polygon_amoy
          description: Blockchain network for the crypto wallet.
          example: ethereum_sepolia
      required:
      - type
      - address
      - blockchain
      additionalProperties: false
      title: Wallet
      example:
        type: crypto_wallet
        address: '0x1111111111111111111111111111111111111111'
        blockchain: ethereum_sepolia
    SortCodeFinancialAddressRequest:
      type: object
      properties:
        type:
          type: string
          description: Discriminator for UK sort code financial address.
          enum:
          - sort_code
        sort_code:
          type: string
          pattern: ^\d{6}$
          description: UK sort code (6 digits).
        account_number:
          type: string
          pattern: ^\d{8}$
          description: UK account number (8 digits).
        account_holder_name:
          type: string
          minLength: 1
          description: Name of the account holder.
      required:
      - type
      - sort_code
      - account_number
      - account_holder_name
      additionalProperties: false
      title: UK Sort Code
      example:
        type: sort_code
        sort_code: '040075'
        account_number: '37778842'
        account_holder_name: Acme Sandbox Ltd.
    AbaFinancialAddress:
      type: object
      properties:
        type:
          type: string
          description: Discriminator for ABA wire financial address.
          enum:
          - aba
        routing_number:
          type: string
          description: ABA routing number (9 digits).
        account_number:
          type: string
          description: Bank account number.
        account_holder_name:
          type: string
          description: Name of the account holder.
        account_type:
          type: string
          enum:
          - checking
          - savings
          - null
          description: Whether the account is a checking or a savings account, or null if not provided.
          nullable: true
      required:
      - type
      - routing_number
      - account_number
      - account_holder_name
      - account_type
      additionalProperties: false
      title: ABA
      example:
        type: aba
        routing_number: '110000000'
        account_number: 000123456789
        account_holder_name: Acme Sandbox Ltd.
        account_type: checking
