    BicFinancialAddress:
      type: object
      properties:
        type:
          type: string
          description: Discriminator for BIC + local account financial address.
          enum:
          - bic
        bic:
          type: string
          description: ISO 9362 Bank Identifier Code (8 or 11 characters).
        account_number:
          type: string
          description: Local-format bank account number.
        account_holder_name:
          type: string
          description: Name of the account holder.
        local_bank_code:
          type: string
          description: Domestic bank or branch code where the destination country uses one (for example the BSB in Australia), or null.
          nullable: true
        account_type:
          type: string
          enum:
          - checking
          - savings
          - null
          description: Whether the account is a checking or a savings account, or null if not provided.
          nullable: true
      required:
      - type
      - bic
      - account_number
      - account_holder_name
      - local_bank_code
      - account_type
      additionalProperties: false
      title: BIC
      example:
        type: bic
        bic: ANZBAU3MXXX
        account_number: '123456789'
        account_holder_name: Acme Sandbox Pty Ltd.
        local_bank_code: '012003'
        account_type: checking
    CreateCounterpartyBodyDto:
      type: object
      properties:
        name:
          description: Name of the counterparty.
          example: Acme Sandbox Ltd.
          type: string
        physical_address:
          description: Physical address of the counterparty.
          type: object
          properties:
            line_1:
              type: string
              description: Primary street address. Optional; omit or send null if not recorded.
              example: 548 Market St
              nullable: true
            line_2:
              type: string
              description: Secondary street address. Optional; omit or send null if not recorded.
              example: Apartment 4B
              nullable: true
            city:
              type: string
              description: City or locality.
              example: San Francisco
            postal_code:
              type: string
              description: Postal or ZIP code. Optional; omit or send null if not recorded.
              example: '94103'
              nullable: true
            state:
              type: string
              description: State, province, or region. Optional; omit or send null if not recorded.
              example: CA
              nullable: true
            country_code:
              example: US
              description: ISO 3166-1 alpha-2 country code.
              $ref: '#/components/schemas/Alpha2Code'
          required:
          - city
          - country_code
          additionalProperties: false
        financial_address:
          oneOf:
          - $ref: '#/components/schemas/AbaFinancialAddressRequest'
          - $ref: '#/components/schemas/IbanFinancialAddressRequest'
          - $ref: '#/components/schemas/SortCodeFinancialAddressRequest'
          - $ref: '#/components/schemas/BicFinancialAddressRequest'
          - $ref: '#/components/schemas/CryptoWalletFinancialAddress'
          description: Financial address of the counterparty.
        date_of_birth:
          description: Date of birth in YYYY-MM-DD format.
          example: '1990-01-15'
          type: string
          format: date
        phone:
          description: Phone number of the counterparty. Stored for operational contact only; it is not sent with payments.
          example: +55 11 91234 5678
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\+?[ ().-]*[0-9][0-9 ().-]*$
        email:
          description: Email address of the counterparty. Stored for operational contact only; it is not sent with payments.
          example: finance@example.com
          type: string
          maxLength: 254
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        legal_id:
          description: 'National tax or identity number of the counterparty, as issued in its country: CPF or CNPJ in Brazil, Cédula or NIT in Colombia, CUIL or CUIT in Argentina, DNI or RUC in Peru, RUT in Chile. Free text, up to 127 characters.'
          example: 12.345.678/0001-95
          type: string
          minLength: 1
          maxLength: 127
        entity_type:
          description: Classification of the counterparty. Defaults to business.
          type: string
          enum:
          - business
          - individual
          - non_profit
          - sole_proprietor
        is_self_owned:
          default: false
          description: Whether the counterparty is self-owned. `false` if the counterparty is not owned by you, `true` if it is.
          type: boolean
        metadata:
          type: object
          propertyNames:
            type: string
            maxLength: 40
          additionalProperties:
            type: string
            maxLength: 500
          description: Set of up to 50 key-value string pairs you can attach to store structured information, such as correlating this resource with an object in your own system. Keys may be up to 40 characters and values up to 500 characters.
          example:
            invoice_id: INV-2026-0042
          nullable: true
      required:
      - financial_address
      additionalProperties: false
    ListCounterpartiesResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                enum:
                - pending
                - active
                - rejected
                description: Counterparty lifecycle status. Blocking is separate.
                example: active
              id:
                type: string
                format: uuid
                description: Unique identifier of the counterparty.
              type:
                type: string
                description: Resource type discriminator.
                enum:
                - counterparty
              name:
                type: string
                description: Name of the counterparty, or null if not recorded.
                example: Acme Sandbox Ltd.
                nullable: true
              entity_type:
                type: string
                enum:
                - business
                - individual
                - non_profit
                - sole_proprietor
                description: Classification of the counterparty.
                example: business
              physical_address:
                type: object
                properties:
                  line_1:
                    type: string
                    description: Primary street address, or null if not recorded.
                    example: 548 Market St
                    nullable: true
                  line_2:
                    type: string
                    description: Secondary street address, or null if not recorded.
                    example: Apartment 4B
                    nullable: true
                  city:
                    type: string
                    description: City or locality.
                    example: San Francisco
                  postal_code:
                    type: string
                    description: Postal or ZIP code, or null if not recorded.
                    example: '94103'
                    nullable: true
                  state:
                    type: string
                    description: State, province, or region, or null if not recorded.
                    example: CA
                    nullable: true
                  country_code:
                    example: US
                    description: ISO 3166-1 alpha-2 country code.
                    $ref: '#/components/schemas/Alpha2Code'
                required:
                - line_1
                - line_2
                - city
                - postal_code
                - state
                - country_code
                additionalProperties: false
                description: Physical address of the counterparty, or null if not recorded.
                nullable: true
              financial_address:
                oneOf:
                - $ref: '#/components/schemas/AbaFinancialAddress'
                - $ref: '#/components/schemas/IbanFinancialAddress'
                - $ref: '#/components/schemas/SortCodeFinancialAddress'
                - $ref: '#/components/schemas/BicFinancialAddress'
                - $ref: '#/components/schemas/CryptoWalletFinancialAddress'
                description: Financial address of the counterparty.
              date_of_birth:
                type: string
                format: date
                description: Date of birth in YYYY-MM-DD format, or null if not recorded.
                example: '1990-01-15'
                nullable: true
              phone:
                type: string
                description: Phone number of the counterparty, or null if not recorded.
                example: +55 11 91234 5678
                nullable: true
              email:
                type: string
                description: Email address of the counterparty, or null if not recorded.
                example: finance@example.com
                nullable: true
              legal_id:
                type: string
                description: National tax or identity number of the counterparty, or null if not recorded.
                example: 12.345.678/0001-95
                nullable: true
              is_self_owned:
                type: boolean
                description: Whether the counterparty is self-owned. `false` if the counterparty is not owned by you, `true` if it is.
                example: false
              blocked:
                type: boolean
                description: Whether payments to or from this counterparty are currently blocked.
                example: false
              metadata:
                type: object
                additionalProperties:
                  type: string
                  maxLength: 500
                description: Set of up to 50 key-value string pairs you can attach to store structured information, such as correlating this resource with an object in your own system. Keys may be up to 40 characters and values up to 500 characters.
                example:
                  invoice_id: INV-2026-0042
            required:
            - status
            - id
            - type
            - name
            - entity_type
            - physical_address
            - financial_address
            - date_of_birth
            - phone
            - email
            - legal_id
            - is_self_owned
            - blocked
            - metadata
            additionalProperties: false
        has_more:
          type: boolean
        next_cursor:
          type: string
          example: eyJsYXN0X2lkIjoiNTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDA2In0
          nullable: true
        has_previous:
          type: boolean
        previous_cursor:
          type: string
          example: eyJsYXN0X2lkIjoiNTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDA2In0
          nullable: true
      required:
      - data
      - has_more
      - next_cursor
      - has_previous
      - previous_cursor
      additionalProperties: false
    BicFinancialAddressRequest:
      type: object
      properties:
        type:
          type: string
          description: Discriminator for BIC + local account financial address.
          enum:
          - bic
        bic:
          type: string
          description: ISO 9362 Bank Identifier Code (8 or 11 characters).
        account_number:
          type: string
          minLength: 1
          maxLength: 34
          pattern: ^[A-Za-z0-9]+$
          description: Local-format bank account number (1-34 alphanumeric characters).
        account_holder_name:
          type: string
          minLength: 1
          description: Name of the account holder.
        local_bank_code:
          type: string
          description: Domestic bank or branch code where the destination country uses one (for example the BSB in Australia). Optional; omit or send null where the country has none.
          nullable: true
        account_type:
          type: string
          enum:
          - checking
          - savings
          - null
          description: Whether the account is a checking or a savings account. Optional; omit or send null if not provided. Some destination countries require it (for example the Dominican Republic, Honduras and Jamaica) and ACH uses it for the transaction code. A payment to an account without one is sent as checking.
          nullable: true
      required:
      - type
      - bic
      - account_number
      - account_holder_name
      additionalProperties: false
      title: BIC
      example:
        type: bic
        bic: ANZBAU3MXXX
        account_number: '123456789'
        account_holder_name: Acme Sandbox Pty Ltd.
        local_bank_code: '012003'
        account_type: checking
    UpdateCounterpartyBodyDto:
      type: object
      properties:
        name:
          type: string
          description: New name, or null to clear the current name.
          example: Acme Sandbox Ltd.
          nullable: true
        physical_address:
          type: object
          properties:
            line_1:
              type: string
              description: Primary street address. Optional; omit or send null if not recorded.
              example: 548 Market St
              nullable: true
            line_2:
              type: string
              description: Secondary street address. Optional; omit or send null if not recorded.
              example: Apartment 4B
              nullable: true
            city:
              type: string
              description: City or locality.
              example: San Francisco
            postal_code:
              type: string
              description: Postal or ZIP code. Optional; omit or send null if not recorded.
              example: '94103'
              nullable: true
            state:
              type: string
              description: State, province, or region. Optional; omit or send null if not recorded.
              example: CA
              nullable: true
            country_code:
              example: US
              description: ISO 3166-1 alpha-2 country code.
              $ref: '#/components/schemas/Alpha2Code'
          required:
          - city
          - country_code
          additionalProperties: false
          description: New physical address, or null to clear the current physical address.
          nullable: true
        date_of_birth:
          type: string
          format: date
          description: New date of birth in YYYY-MM-DD format, or null to clear the current date of birth.
          example: '1990-01-15'
          nullable: true
        phone:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\+?[ ().-]*[0-9][0-9 ().-]*$
          description: New phone number, or null to clear the current phone number.
          example: +55 11 91234 5678
          nullable: true
        email:
          type: string
          maxLength: 254
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          description: New email address, or null to clear the current email address.
          example: finance@example.com
          nullable: true
        legal_id:
          type: string
          minLength: 1
          maxLength: 127
          description: New legal identifier, or null to clear the current legal identifier.
          example: 12.345.678/0001-95
          nullable: true
        entity_type:
          description: New entity type. Omit to keep the current entity type.
          type: string
          enum:
          - business
          - individual
          - non_profit
          - sole_proprietor
        is_self_owned:
          description: New ownership status. Omit to keep the current ownership status.
          type: boolean
      additionalProperties: false
    CounterpartyResourceDto:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending
          - active
          - rejected
          description: Counterparty lifecycle status. Blocking is separate.
          example: active
        id:
          type: string
          format: uuid
          description: Unique identifier of the counterparty.
        type:
          type: string
          description: Resource type discriminator.
          enum:
          - counterparty
        name:
          type: string
          description: Name of the counterparty, or null if not recorded.
          example: Acme Sandbox Ltd.
          nullable: true
        entity_type:
          type: string
          enum:
          - business
          - individual
          - non_profit
          - sole_proprietor
          description: Classification of the counterparty.
          example: business
        physical_address:
          type: object
          properties:
            line_1:
              type: string
              description: Primary street address, or null if not recorded.
              example: 548 Market St
              nullable: true
            line_2:
              type: string
              description: Secondary street address, or null if not recorded.
              example: Apartment 4B
              nullable: true
            city:
              type: string
              description: City or locality.
              example: San Francisco
