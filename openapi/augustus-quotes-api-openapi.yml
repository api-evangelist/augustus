openapi: 3.2.0
info:
  title: Augustus Banking Quotes API
  description: Augustus Banking API
  version: 0.1.0
  contact:
    name: Augustus
    url: https://docs.augustus.com
    email: developer@augustus.com
servers:
- url: https://api.augustus.com
  description: Production
- url: https://api.sandbox.augustus.com
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Quotes
paths:
  /v1/quotes/indicative:
    get:
      description: Returns an indicative quote for a currency pair. Not persisted or holdable.
      operationId: QuotesController_getIndicativeQuote
      parameters:
      - name: source_currency
        required: true
        in: query
        description: Currency code (ISO 4217 or crypto).
        schema:
          example: USD
          type: string
          enum:
          - EUR
          - GBP
          - USD
          - USDC
          - BTC
          - ETH
          - SOL
          - POL
      - name: target_currency
        required: true
        in: query
        description: Currency code (ISO 4217 or crypto).
        schema:
          example: USDC
          type: string
          enum:
          - EUR
          - GBP
          - USD
          - USDC
          - BTC
          - ETH
          - SOL
          - POL
      - name: source_amount
        required: false
        in: query
        description: Amount as a string decimal (e.g. "100.50").
        schema:
          pattern: ^\d+(\.\d+)?$
          example: '100.50'
          type: string
      responses:
        '200':
          description: The indicative quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIndicativeQuoteResponseDto'
      summary: Get indicative quote
      tags:
      - Quotes
components:
  schemas:
    GetIndicativeQuoteResponseDto:
      type: object
      properties:
        source_amount:
          type: string
          description: Amount as a string decimal (e.g. "100.50").
          example: '100.50'
        source_currency:
          type: string
          enum:
          - EUR
          - GBP
          - USD
          - USDC
          - BTC
          - ETH
          - SOL
          - POL
          description: Currency code (ISO 4217 or crypto).
          example: USD
        target_amount:
          type: string
          description: Amount as a string decimal (e.g. "100.50").
          example: '100.50'
        target_currency:
          type: string
          enum:
          - EUR
          - GBP
          - USD
          - USDC
          - BTC
          - ETH
          - SOL
          - POL
          description: Currency code (ISO 4217 or crypto).
          example: USDC
        rate:
          type: string
          description: Conversion rate applied.
          example: '1.0000'
        fee:
          type: object
          properties:
            amount:
              type: string
              description: Fee amount as a string decimal.
              example: '0.50'
            currency:
              type: string
              enum:
              - EUR
              - GBP
              - USD
              - USDC
              - BTC
              - ETH
              - SOL
              - POL
              description: Fee currency code.
              example: USD
          required:
          - amount
          - currency
          additionalProperties: false
          description: Conversion fee, or null if no fee applies.
          nullable: true
        quoted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the quote was fetched.
          example: '2026-01-15T10:30:00Z'
      required:
      - source_amount
      - source_currency
      - target_amount
      - target_currency
      - rate
      - fee
      - quoted_at
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Bearer token for authentication with Augustus Banking API
