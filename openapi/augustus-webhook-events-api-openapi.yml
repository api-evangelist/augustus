webhooks:
  payout.created:
    post:
      summary: payout.created
      x-mint:
        metadata:
          title: payout.created
          sidebarTitle: payout.created
      description: Sent when a payout is created.
      operationId: webhook_payout_created
      tags:
      - Webhook Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Unique identifier for the event. Stable across retries.
                type:
                  type: string
                  enum:
                  - payout.created
                  description: Event type in resource.action format.
                api_version:
                  type: string
                  description: API version the payload was rendered at. Stable across retries and redeliveries.
                payload:
                  $ref: '#/components/schemas/PayoutResourceDto'
                  description: Full resource snapshot at the time of the event.
                date:
                  type: string
                  format: date-time
                  description: ISO 8601 UTC timestamp when the event was created.
              required:
              - id
              - type
              - api_version
              - payload
              - date
      responses:
        '200':
          description: Event received successfully.
