openapi: 3.2.0
info:
  title: Augustus Banking Scopes API
  description: Augustus Banking API
  version: 0.1.0
  contact:
    name: Augustus
    url: https://docs.augustus.com
    email: developer@augustus.com
servers:
- url: https://api.augustus.com
  description: Production
- url: https://api.sandbox.augustus.com
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Scopes
paths:
  /v1/scopes:
    get:
      description: 'Returns the catalogue of scopes available to API keys. The list is filtered by the `Api-Version` request header and defaults to the latest version when the header is omitted. Public: no authentication required.'
      operationId: ScopesController_list
      parameters: []
      responses:
        '200':
          description: Scope catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListScopesResponseDto'
      summary: List scopes
      tags:
      - Scopes
components:
  schemas:
    ListScopesResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                description: Resource type discriminator.
                enum:
                - scope
              id:
                type: string
                enum:
                - payouts:read
                - payouts:write
                - deposits:read
                - returns:read
                - returns:write
                - conversions:read
                - conversions:write
                - quotes:read
                - accounts:read
                - accounts:write
                - account_programs:read
                - account_holders:read
                - account_holders:write
                - counterparties:read
                - counterparties:write
                - webhook_subscriptions:read
                - webhook_subscriptions:write
                - events:read
                - webhook_deliveries:read
                - webhook_deliveries:write
                - transactions:read
                - simulations:write
                - payout_tracking_events:read
                description: Scope identifier in `resource:action` format.
              description:
                type: string
                description: Human-readable description of the scope.
                example: Grants read access to payouts.
              resource:
                type: string
                description: Resource the scope applies to.
                example: payouts
              action:
                type: string
                enum:
                - read
                - write
                description: Action category.
              available_from:
                type: string
                description: First API version that exposes this scope.
                example: '2026-05-01'
              deprecated_in:
                type: string
                description: API version in which this scope was deprecated; null if not deprecated.
                example: null
                nullable: true
            required:
            - type
            - id
            - description
            - resource
            - action
            - available_from
            - deprecated_in
            additionalProperties: false
        has_more:
          type: boolean
        next_cursor:
          type: string
          example: eyJsYXN0X2lkIjoiNTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDA2In0
          nullable: true
        has_previous:
          type: boolean
        previous_cursor:
          type: string
          example: eyJsYXN0X2lkIjoiNTUwZTg0MDAtZTI5Yi00MWQ0LWE3MTYtNDQ2NjU1NDQwMDA2In0
          nullable: true
      required:
      - data
      - has_more
      - next_cursor
      - has_previous
      - previous_cursor
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Bearer token for authentication with Augustus Banking API
