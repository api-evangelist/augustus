aid: augustus
name: Augustus
description: >-
  Augustus (formerly Ivy, getivy.io) is a global payments and banking platform
  that lets developers move money between fiat and stablecoins, accept Open
  Banking bank payments, send payouts, run FX conversions, and hold balances
  through a single REST API. Building blocks include accounts and virtual
  accounts, account programs, checkout sessions and orders, deposits, payouts,
  refunds and returns, conversions and quotes, plus webhooks for real-time
  events. Augustus runs the Ivy Open Banking API (version 2023-01-01) alongside
  the newer Augustus Banking API (version 2026-05-01), authenticates with
  scoped bearer API keys, supports idempotent POSTs and cursor pagination, and
  is building an AI-native, stablecoin-based clearing bank. Backed by Creandum
  and Valar Ventures.
