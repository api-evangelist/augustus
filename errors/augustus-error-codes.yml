description: >-
  The Augustus Banking API (2026-05-01) error registry. All errors return a flat
  JSON object (not RFC 9457 problem+json) with a stable machine-readable code.
  Branch on code, never on message.
envelope:
  format: flat-json
  fields:
  - name: category
    required: true
    description: 'Broad classification: api_error, authentication_error, idempotency_error, invalid_request_error, rate_limit_error'
  - name: code
    required: true
    description: Machine-readable error code for programmatic handling
  - name: message
    required: true
    description: Human-readable description; not a stable contract
  - name: param
    required: true
    description: Request parameter that caused the error, or null
  - name: doc_url
    required: true
    description: Link to documentation explaining the error
  - name: correlation_id
    required: true
    description: Unique request identifier, also returned as the Correlation-Id response header
categories:
- id: api_error
  meaning: Server-side failure. You did nothing wrong. Retry may help.
- id: authentication_error
  meaning: Missing or invalid API key.
- id: idempotency_error
  meaning: Idempotency key conflict (reuse with different params).
- id: invalid_request_error
  meaning: 'Client-side problem: bad parameters, not found, state conflict.'
- id: rate_limit_error
  meaning: Too many requests. Back off and retry.
